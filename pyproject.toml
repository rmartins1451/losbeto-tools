[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "losbeto-tools"
version = "1.1.0"
description = "Cross-asset market data tools for AI agents (forex, equities, commodities, macro, crypto) over x402 — free delayed data, pay-per-call for real-time. LangChain, CrewAI, AutoGen and OpenAI/Anthropic function schemas."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Roberto Martins"}]
keywords = ["ai-agents", "langchain", "crewai", "autogen", "x402", "market-data",
            "forex", "stocks", "commodities", "macro", "mcp", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.80", "pydantic>=2"]
autogen = ["pyautogen>=0.2"]
all = ["langchain-core>=0.3", "crewai>=0.80", "pydantic>=2", "pyautogen>=0.2"]

[project.urls]
Homepage = "https://api.losbeto.xyz"
Documentation = "https://api.losbeto.xyz/llms.txt"
Source = "https://github.com/rmartins1451/losbeto-tools"

[tool.setuptools]
packages = ["losbeto_tools"]

[tool.setuptools.package-data]
losbeto_tools = ["function_schemas.json"]
